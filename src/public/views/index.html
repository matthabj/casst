<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/x-icon" href="/assets/casst-icon.ico">
	<title>Casst App</title>

	<link href="https://fonts.cdnfonts.com/css/finlandica" rel="stylesheet">
	<link href="https://fonts.cdnfonts.com/css/spline-sans" rel="stylesheet">
	<link href="https://fonts.cdnfonts.com/css/radio-canada-2" rel="stylesheet">
	<link href="https://fonts.cdnfonts.com/css/kantumruy-pro" rel="stylesheet">
	<link href="https://fonts.cdnfonts.com/css/br-cobane" rel="stylesheet">
	<link href="https://fonts.cdnfonts.com/css/inclusive-sans-2" rel="stylesheet">
	<link href="https://fonts.cdnfonts.com/css/rubik-2" rel="stylesheet">
	<link rel="stylesheet" href="/styles/style.css">

	<script src="/scripts/utils.js"></script>
	<script defer src="/scripts/radiogroup.js"></script>
	<script defer src="/scripts/router.js"></script>
	<script defer src="/scripts/script.js"></script>
	<script defer src="/scripts/view-index.js"></script>
</head>
<body>
	<div class="pannel" style="margin: auto;">
		<form class="form-create-poll">
			<header>
				Create Poll
			</header>
			<main>
				<div class="input-group">
					<!-- <span class="label">Poll heading</span> -->
					<input class="poll-title" type="text" placeholder="Enter poll heading...">
				</div>
				<div class="options-container">
					<h3>Options</h3>
					<div class="input-group">
						<input class="poll-option" type="text" placeholder="Enter option 1">
						<div class="icon icon-right" data-src="assets/radio.svg"></div>
					</div>
					<div class="input-group">
						<input class="poll-option" type="text" placeholder="Enter option 2">
						<div class="icon icon-right" data-src="assets/radio.svg"></div>
					</div>
				</div>
				<button type="button" class="secondary">New option</button>
				<button type="submit">Submit</button>
			</main>
		</form>
	</div>
</body>
</html>
