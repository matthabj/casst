<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/x-icon" href="/assets/casst-icon.ico">
	<title>Casst App</title>

	<link href="https://fonts.cdnfonts.com/css/finlandica" rel="stylesheet">
	<link href="https://fonts.cdnfonts.com/css/spline-sans" rel="stylesheet">
	<link href="https://fonts.cdnfonts.com/css/radio-canada-2" rel="stylesheet">
	<link href="https://fonts.cdnfonts.com/css/kantumruy-pro" rel="stylesheet">
	<link href="https://fonts.cdnfonts.com/css/br-cobane" rel="stylesheet">
	<link href="https://fonts.cdnfonts.com/css/inclusive-sans-2" rel="stylesheet">
	<link href="https://fonts.cdnfonts.com/css/rubik-2" rel="stylesheet">
	<link rel="stylesheet" href="/styles/style.css">

	<script src="/scripts/utils.js"></script>
	<script defer src="/scripts/radiogroup.js"></script>
	<script defer src="/scripts/router.js"></script>
</head>
<body>
	<h1>Admin view</h1>
	<div class="pannel" style="margin: auto;">
		<form>
			<header>
				Create Poll
			</header>
			<main>
				<div class="input-group">
					<span class="label">Poll heading</span>
					<input type="text" placeholder="Enter poll heading...">
				</div>
				<div class="options-container">
					<h3>Options</h3>
					<div class="input-group">
						<span class="label">Option #1</span>
						<input type="text" placeholder="Enter option text...">
					</div>
				</div>
				<button>New option</button>
			</main>
		</form>
	</div>
</body>
</html>
